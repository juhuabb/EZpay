<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>购买记录</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/css/layui.css">
<style>
body{padding:20px;background:#f5f6fa;margin:0}
.toolbar{background:#fff;padding:16px 20px;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar select,.toolbar input{height:36px;border:1px solid #e6e6e6;border-radius:4px;padding:0 10px}
.toolbar input{width:160px}
.table-wrap{background:#fff;padding:0 20px 20px;border-radius:0 0 8px 8px}
.addr-cell{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-cell{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="toolbar">
    <input type="text" id="searchOrderNo" placeholder="订单号搜索" autocomplete="off">
    <input type="text" id="searchUserId" placeholder="用户ID搜索" autocomplete="off">
    <select id="filterStatus">
        <option value="">全部状态</option>
        <option value="0">待支付</option>
        <option value="1">已支付</option>
        <option value="2">已过期</option>
        <option value="3">已取消</option>
    </select>
    <button class="layui-btn layui-btn-sm" id="btnSearch" style="background:#2979FF">
        <i class="layui-icon layui-icon-search"></i> 搜索
    </button>
</div>
<div class="table-wrap">
    <table class="layui-table" id="rechargeTable" lay-filter="rechargeTable"></table>
</div>

<script type="text/html" id="statusTpl">
{{# if(d.status === 0){ }}
    <span class="layui-badge layui-bg-orange">待支付</span>
{{# } else if(d.status === 1){ }}
    <span class="layui-badge layui-bg-green">已支付</span>
{{# } else if(d.status === 2){ }}
    <span class="layui-badge layui-bg-gray">已过期</span>
{{# } else if(d.status === 3){ }}
    <span class="layui-badge layui-bg-gray">已取消</span>
{{# } else { }}
    <span class="layui-badge layui-bg-gray">未知</span>
{{# } }}
</script>

<script type="text/html" id="rechargeBar">
{{# if(d.status !== 1){ }}
    <a class="layui-btn layui-btn-xs" lay-event="credit" style="background:#009688">手动到账</a>
{{# } }}
</script>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/layui.js"></script>
<script>
layui.use(['table','layer','jquery'],function(){
    var table=layui.table,layer=layui.layer,$=layui.$;
    var token=localStorage.getItem('admin_token')||'';

    function getSearchParams(){
        return {
            order_no:$('#searchOrderNo').val()||'',
            user_id:$('#searchUserId').val()||'',
            status:$('#filterStatus').val()||''
        };
    }

    table.render({
        elem:'#rechargeTable',
        url:'/index/adminRechargeListData',
        headers:{'Authorization':'Bearer '+token},
        where:{page:1,limit:15},
        parseData:function(r){
            return{code:r.code===0?0:1,msg:r.msg||'',count:r.data?r.data.total:0,data:r.data?r.data.list:[]};
        },
        page:true,
        limit:15,
        limits:[10,15,30,50],
        cols:[[
            {field:'id',title:'ID',width:70,sort:true},
            {field:'order_no',title:'交易单号',width:200},
            {field:'user_nickname',title:'用户',width:120},
            {field:'from_address',title:'支付地址',width:190,templet:function(d){
                if(!d.from_address) return '<span style="color:#999">-</span>';
                return '<span class="addr-cell" title="'+d.from_address+'">'+d.from_address+'</span>';
            }},
            {field:'currency',title:'币种',width:80},
            {field:'amount',title:'支付金额',width:110,templet:function(d){
                return parseFloat(d.amount||0).toFixed(2)+' '+d.currency;
            }},
            {field:'points',title:'购买积分',width:100,templet:function(d){
                return '<span style="color:#009688;font-weight:bold">'+parseFloat(d.points||0).toFixed(2)+'</span>';
            }},
            {field:'rate',title:'汇率',width:90,templet:function(d){
                return '1'+d.currency+'='+parseFloat(d.rate||0).toFixed(2);
            }},
            {field:'status',title:'状态',width:100,templet:'#statusTpl'},
            {field:'tx_hash',title:'交易哈希',width:130,templet:function(d){
                if(!d.tx_hash) return '-';
                return '<span class="tx-cell" title="'+d.tx_hash+'">'+d.tx_hash+'</span>';
            }},
            {field:'created_at',title:'创建时间',width:170},
            {field:'paid_at',title:'确认时间',width:170,templet:function(d){
                return d.paid_at||'-';
            }},
            {title:'操作',width:110,toolbar:'#rechargeBar',fixed:'right'}
        ]]
    });

    $('#btnSearch').on('click',function(){
        table.reload('rechargeTable',{
            where:getSearchParams(),
            page:{curr:1}
        });
    });

    $('#searchOrderNo,#searchUserId').on('keydown',function(e){
        if(e.keyCode===13){$('#btnSearch').click();}
    });

    table.on('tool(rechargeTable)',function(obj){
        var data=obj.data;
        if(obj.event==='credit'){
            layer.confirm(
                '确认手动到账？\n\n订单号：'+data.order_no+
                '\n用户：'+data.user_nickname+
                '\n币种：'+data.currency+
                '\n支付金额：'+data.amount+
                '\n到账积分：'+data.points+
                '\n当前状态：'+data.status_text+
                '\n\n点击确认将立即为用户增加'+data.points+'积分',
                {area:['460px','auto']},
                function(index){
                    layer.close(index);
                    var loadIdx=layer.load(1);
                    $.ajax({
                        url:'/index/adminRechargeManualCredit',
                        type:'POST',
                        headers:{'Authorization':'Bearer '+token},
                        contentType:'application/json',
                        data:JSON.stringify({id:data.id}),
                        success:function(res){
                            layer.close(loadIdx);
                            if(res.code===0){
                                layer.msg(res.msg,{icon:1});
                                table.reload('rechargeTable');
                            }else{
                                layer.msg(res.msg||'操作失败',{icon:2});
                            }
                        },
                        error:function(){
                            layer.close(loadIdx);
                            layer.msg('演示系统不具备数据操作能力，请购买！',{icon:2});
                        }
                    });
                }
            );
        }
    });
});
</script>
</body>
</html>

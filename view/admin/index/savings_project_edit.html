<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>积分宝 - 项目设置</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/css/layui.css">
<style>
body{padding:20px;background:#f5f6fa}
.pub-box{background:#fff;padding:25px 30px;border-radius:8px;max-width:820px}
.pub-title{font-size:18px;font-weight:bold;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #eee}
.tip{color:#999;font-size:12px;margin-top:5px}
.load-tip{text-align:center;padding:40px;color:#999;font-size:14px}
</style>
</head>
<body>
<div class="pub-box">
  <div class="pub-title">项目设置 <span id="projName" style="font-size:14px;font-weight:normal;color:#888;margin-left:10px"></span></div>
  <div id="loadTip" class="load-tip">加载中...</div>
  <form class="layui-form" lay-filter="editForm" id="editFormBox" style="display:none">
    <input type="hidden" name="id" id="projId">
    <div class="layui-form-item">
      <label class="layui-form-label">项目名称</label>
      <div class="layui-input-block">
        <input type="text" name="name" required lay-verify="required" placeholder="如：新春存积分送好礼" class="layui-input" maxlength="100">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">存管期限</label>
      <div class="layui-input-inline" style="width:160px">
        <input type="number" name="duration_days" required lay-verify="required" placeholder="天数" class="layui-input" min="1">
      </div>
      <div class="layui-form-mid layui-word-aux">天（仅影响新认购订单，已有订单不受影响）</div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">存满奖励率</label>
      <div class="layui-input-inline" style="width:160px">
        <input type="number" name="reward_rate" required lay-verify="required" placeholder="如 3" class="layui-input" step="0.01" min="0.01">
      </div>
      <div class="layui-form-mid layui-word-aux">% （仅影响新认购，已有订单快照不变）</div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">总份额</label>
      <div class="layui-input-inline" style="width:200px">
        <input type="number" name="total_quota" required lay-verify="required" placeholder="项目总积分额度" class="layui-input" step="0.01" min="0.01">
      </div>
      <div class="layui-form-mid layui-word-aux">积分（不能低于已认购量）</div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">单人最低认购</label>
      <div class="layui-input-inline" style="width:160px">
        <input type="number" name="min_purchase" required lay-verify="required" placeholder="如 100" class="layui-input" step="0.01" min="0.01">
      </div>
      <div class="layui-form-mid layui-word-aux">积分</div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">单人最高认购</label>
      <div class="layui-input-inline" style="width:160px">
        <input type="number" name="max_purchase" placeholder="0 表示不限" class="layui-input" step="0.01" min="0">
      </div>
      <div class="layui-form-mid layui-word-aux">积分（填 0 表示不限制）</div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">单人限购1次</label>
      <div class="layui-input-block">
        <input type="checkbox" name="per_user_limit" lay-skin="switch" lay-text="限1次|不限">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">提前赎回</label>
      <div class="layui-input-inline" style="width:180px">
        <input type="checkbox" name="allow_early_redeem" lay-skin="switch" lay-text="允许|不允许">
      </div>
      <div class="layui-form-mid layui-word-auc">关闭后用户只能持有到期</div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">赎回扣本金</label>
      <div class="layui-input-inline" style="width:160px">
        <input type="number" name="early_redeem_deduct_rate" placeholder="0" class="layui-input" step="0.01" min="0" max="100" value="0">
      </div>
      <div class="layui-form-mid layui-word-aux">% 提前赎回时扣除本金的比例（0-100）</div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">赎回奖励</label>
      <div class="layui-input-inline" style="width:220px">
        <select name="early_redeem_reward_policy" lay-verify="required">
          <option value="0">不发放奖励（默认，防刷）</option>
          <option value="1">按持有天数折算</option>
          <option value="2">全额发放奖励</option>
        </select>
      </div>
      <div class="layui-form-mid layui-word-aux">提前赎回时的奖励处理方式</div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">开售时间</label>
      <div class="layui-input-inline" style="width:220px">
        <input type="text" name="start_time" id="startTime" placeholder="不填立即开售" class="layui-input" readonly>
      </div>
      <div class="layui-form-mid layui-word-aux">不填则发布后立即可认购</div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">认购截止</label>
      <div class="layui-input-inline" style="width:220px">
        <input type="text" name="end_time" id="endTime" placeholder="不填不限" class="layui-input" readonly>
      </div>
      <div class="layui-form-mid layui-word-aux">不填则售罄或手动关闭前一直可认购</div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">项目配图URL</label>
      <div class="layui-input-block">
        <input type="text" name="banner_image" placeholder="可选，项目卡片配图地址" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">项目说明</label>
      <div class="layui-input-block">
        <textarea name="description" placeholder="活动规则说明（展示给用户）" class="layui-textarea" style="min-height:90px"></textarea>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">项目状态</label>
      <div class="layui-input-block">
        <select name="status" lay-verify="required">
          <option value="0">草稿</option>
          <option value="1">进行中</option>
          <option value="2">已暂停</option>
          <option value="3">已结束</option>
          <option value="4">已关闭</option>
        </select>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-input-block">
        <button class="layui-btn" lay-submit lay-filter="btnSave">保存设置</button>
        <button type="button" class="layui-btn layui-btn-primary" id="btnBack">返回列表</button>
      </div>
    </div>
    <div class="tip">提示：修改奖励率、期限等参数仅对新认购的用户生效，已认购订单的参数在认购时已快照锁定。</div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/layui.js"></script>
<script>
layui.use(['form','layer','laydate'], function(){
  var form = layui.form, layer = layui.layer, laydate = layui.laydate, $ = layui.$;
  function token(){ return localStorage.getItem('admin_token') || ''; }

  laydate.render({elem:'#startTime', type:'datetime'});
  laydate.render({elem:'#endTime', type:'datetime'});

  // 获取项目ID
  var urlParams = new URLSearchParams(location.search);
  var projId = urlParams.get('id');
  if(!projId){ layer.msg('缺少项目ID', {icon:2}); return; }
  $('#projId').val(projId);

  // 加载项目数据
  fetch('/index/adminSavingsProjectDetail?id='+projId, {headers:{'Authorization':'Bearer '+token()}})
    .then(function(r){return r.json()})
    .then(function(r){
      if(r.code !== 0 || !r.data){
        layer.msg(r.msg || '加载失败', {icon:2});
        return;
      }
      var d = r.data;
      $('#projName').text(d.name || '');

      // 填充表单
      $('input[name="name"]').val(d.name || '');
      $('input[name="duration_days"]').val(d.duration_days || '');
      $('input[name="reward_rate"]').val(d.reward_rate || '');
      $('input[name="total_quota"]').val(d.total_quota || '');
      $('input[name="min_purchase"]').val(d.min_purchase || '100');
      $('input[name="max_purchase"]').val(d.max_purchase || '0');
      $('input[name="early_redeem_deduct_rate"]').val(d.early_redeem_deduct_rate || '0');
      $('select[name="early_redeem_reward_policy"]').val(d.early_redeem_reward_policy || '0');
      $('input[name="start_time"]').val(d.start_time || '');
      $('input[name="end_time"]').val(d.end_time || '');
      $('input[name="banner_image"]').val(d.banner_image || '');
      $('textarea[name="description"]').val(d.description || '');
      $('select[name="status"]').val(d.status != null ? d.status : '1');

      // 开关类
      if(d.per_user_limit == 1){ $('input[name="per_user_limit"]').prop('checked', true); }
      if(d.allow_early_redeem == 1){ $('input[name="allow_early_redeem"]').prop('checked', true); }

      form.render();
      $('#loadTip').hide();
      $('#editFormBox').show();
    })
    .catch(function(){
      layer.msg('网络错误，加载失败', {icon:2});
    });

  // 保存
  form.on('submit(btnSave)', function(data){
    var f = data.field;
    f.id = projId;
    f.per_user_limit = f.per_user_limit ? 1 : 0;
    f.allow_early_redeem = f.allow_early_redeem ? 1 : 0;
    var rate = parseFloat(f.early_redeem_deduct_rate);
    if (isNaN(rate) || rate < 0) rate = 0;
    if (rate > 100) { layer.msg('赎回扣本金比例不能超过100%', {icon:2}); return false; }
    f.early_redeem_deduct_rate = rate;
    var policy = parseInt(f.early_redeem_reward_policy);
    if (isNaN(policy) || [0,1,2].indexOf(policy) === -1) policy = 0;
    f.early_redeem_reward_policy = policy;

    var btn = $(this);
    btn.attr('disabled', true).addClass('layui-btn-disabled');
    fetch('/index/adminSavingsProjectUpdate', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token()},
      body: JSON.stringify(f)
    }).then(function(r){return r.json()}).then(function(r){
      btn.attr('disabled', false).removeClass('layui-btn-disabled');
      if(r.code === 0){
        layer.msg('保存成功', {icon:1, time:1500}, function(){
          parent && parent.switchPage ? parent.switchPage('/index/adminSavingsProjectList') : location.href = '/index/adminSavingsProjectList';
        });
      } else {
        layer.msg(r.msg || '保存失败', {icon:2});
      }
    }).catch(function(){
      btn.attr('disabled', false).removeClass('layui-btn-disabled');
      layer.msg('演示系统请购买后获得完整版', {icon:2});
    });
    return false;
  });

  // 返回
  $('#btnBack').on('click', function(){
    if(parent && parent.switchPage){ parent.switchPage('/index/adminSavingsProjectList'); }
    else { location.href = '/index/adminSavingsProjectList'; }
  });
});
</script>
</body>
</html>

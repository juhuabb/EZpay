<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>APP热更新管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/css/layui.css">
<style>
body { background: #f0f2f5; padding: 20px; margin: 0; }
.card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.pager { margin-top: 15px; text-align: center; }
.pager button { margin: 0 5px; }
.status-online { padding: 2px 8px; border-radius: 4px; font-size: 12px; display: inline-block; background: #52c41a; color: #fff; }
.status-offline { padding: 2px 8px; border-radius: 4px; font-size: 12px; display: inline-block; background: #f0f0f0; color: #999; }
.force-tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; display: inline-block; background: #ff5722; color: #fff; margin-left: 5px; }
.form-row { margin-bottom: 10px; }
.form-row label { display: inline-block; width: 80px; text-align: right; padding-right: 10px; font-size: 14px; }
.form-row input, .form-row textarea { border: 1px solid #e6e6e6; border-radius: 2px; padding: 0 10px; box-sizing: border-box; }
.tip { color: #999; font-size: 12px; margin-left: 90px; margin-top: -5px; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="card">
  <h2 style="font-size:16px;margin:0 0 15px 0;">发布新版本</h2>
  <form id="versionForm" enctype="multipart/form-data">
    <div class="form-row">
      <label>版本号</label>
      <input type="text" id="version" placeholder="如 1.0.1（必须大于当前版本）" style="width:200px;height:38px;">
    </div>
    <div class="form-row">
      <label>更新标题</label>
      <input type="text" id="title" placeholder="如 发现新版本" style="width:400px;height:38px;">
    </div>
    <div class="form-row">
      <label>更新内容</label>
      <textarea id="content" placeholder="每行一条更新说明" style="width:500px;height:100px;padding:10px;resize:vertical;"></textarea>
    </div>
    <div class="form-row">
      <label>强制更新</label>
      <input type="checkbox" id="force_update" style="vertical-align:middle;"> <span style="font-size:13px;color:#666;">勾选后用户必须更新才能继续使用</span>
    </div>
    <div class="form-row">
      <label>wgt文件</label>
      <input type="file" id="wgt_file" accept=".wgt" style="display:inline-block;">
    </div>
    <div class="tip">在HBuilderX中：发行 → 原生App-制作移动App资源升级包 → 生成.wgt文件</div>
    <div style="margin-left:90px;margin-top:10px;">
      <button type="button" class="layui-btn" onclick="createVersion()">创建版本</button>
    </div>
  </form>
</div>

<div class="card">
  <h2 style="font-size:16px;margin:0 0 15px 0;">版本列表</h2>
  <table class="layui-table" style="margin-top:10px;">
    <thead>
      <tr>
        <th style="width:50px;">ID</th>
        <th style="width:80px;">版本号</th>
        <th style="width:120px;">标题</th>
        <th>更新内容</th>
        <th style="width:80px;">强制</th>
        <th style="width:80px;">状态</th>
        <th style="width:150px;">创建时间</th>
        <th style="width:180px;">操作</th>
      </tr>
    </thead>
    <tbody id="listBody">
      <tr><td colspan="8" style="text-align:center;color:#999;padding:20px;">加载中...</td></tr>
    </tbody>
  </table>
  <div class="pager" id="pager"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/layui.js"></script>
<script>
var currentPage = 1;
var totalPages = 1;
var pageSize = 20;

function loadList(page) {
  if (page) currentPage = page;
  fetch('/index/adminAppVersionListData?page=' + currentPage + '&limit=' + pageSize)
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.code !== 0) {
        document.getElementById('listBody').innerHTML = '<tr><td colspan="8" style="text-align:center;color:red;">' + (res.msg || '加载失败') + '</td></tr>';
        return;
      }
      var list = res.data.list || [];
      var total = res.data.total || 0;
      totalPages = Math.ceil(total / pageSize) || 1;
      if (list.length === 0) {
        document.getElementById('listBody').innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;padding:20px;">暂无版本记录</td></tr>';
      } else {
        var html = '';
        list.forEach(function(item) {
          var statusHtml = item.is_active == 1
            ? '<span class="status-online">线上发行</span>'
            : '<span class="status-offline">未上线</span>';
          var forceHtml = item.force_update == 1
            ? '<span class="force-tag">强制</span>'
            : '否';
          var contentHtml = (item.content || '--').replace(/\n/g, '<br>');
          var actionHtml = '';
          if (item.is_active == 1) {
            actionHtml += '<button class="layui-btn layui-btn-sm layui-btn-warm" onclick="unsetActive(' + item.id + ')">取消线上</button> ';
          } else {
            actionHtml += '<button class="layui-btn layui-btn-sm" onclick="setActive(' + item.id + ')">设为线上</button> ';
          }
          if (item.is_active != 1) {
            actionHtml += '<button class="layui-btn layui-btn-sm layui-btn-danger" onclick="deleteVersion(' + item.id + ')">删除</button>';
          }
          html += '<tr>';
          html += '<td>' + item.id + '</td>';
          html += '<td><strong>v' + (item.version || '') + '</strong></td>';
          html += '<td>' + (item.title || '--') + '</td>';
          html += '<td style="max-width:300px;word-break:break-all;">' + contentHtml + '</td>';
          html += '<td>' + forceHtml + '</td>';
          html += '<td>' + statusHtml + '</td>';
          html += '<td>' + (item.created_at || '--') + '</td>';
          html += '<td>' + actionHtml + '</td>';
          html += '</tr>';
        });
        document.getElementById('listBody').innerHTML = html;
      }
      var pagerHtml = '';
      if (currentPage > 1) {
        pagerHtml += '<button class="layui-btn layui-btn-sm layui-btn-primary" onclick="loadList(' + (currentPage - 1) + ')">上一页</button>';
      }
      pagerHtml += '<span style="margin:0 10px;">第 ' + currentPage + ' / ' + totalPages + ' 页 (共' + total + '条)</span>';
      if (currentPage < totalPages) {
        pagerHtml += '<button class="layui-btn layui-btn-sm layui-btn-primary" onclick="loadList(' + (currentPage + 1) + ')">下一页</button>';
      }
      document.getElementById('pager').innerHTML = pagerHtml;
    })
    .catch(function(e) {
      document.getElementById('listBody').innerHTML = '<tr><td colspan="8" style="text-align:center;color:red;">请求失败：' + e.message + '</td></tr>';
    });
}

function createVersion() {
  var version = document.getElementById('version').value.trim();
  var title = document.getElementById('title').value.trim();
  var content = document.getElementById('content').value.trim();
  var forceUpdate = document.getElementById('force_update').checked ? 1 : 0;
  var fileInput = document.getElementById('wgt_file');

  if (!version) { layui.layer.msg('请填写版本号'); return; }
  if (!title) { layui.layer.msg('请填写更新标题'); return; }
  if (!fileInput.files[0]) { layui.layer.msg('请选择wgt文件'); return; }

  var formData = new FormData();
  formData.append('version', version);
  formData.append('title', title);
  formData.append('content', content);
  formData.append('force_update', forceUpdate);
  formData.append('wgt_file', fileInput.files[0]);

  var loadIndex = layui.layer.load(1, {shade: [0.3, '#000']});

  fetch('/index/adminAppVersionCreate', {
    method: 'POST',
    body: formData
  }).then(function(r) { return r.json(); }).then(function(res) {
    layui.layer.close(loadIndex);
    layui.layer.msg(res.code === 0 ? '创建成功' : (res.msg || '创建失败'));
    if (res.code === 0) {
      document.getElementById('version').value = '';
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      document.getElementById('force_update').checked = false;
      fileInput.value = '';
      loadList(1);
    }
  }).catch(function(e) {
    layui.layer.close(loadIndex);
    layui.layer.msg('对不起，演示版本不允许创建更新！');
  });
}

function setActive(id) {
  layui.layer.confirm('确定将此版本设为线上发行？其他版本将自动下线。', function(index) {
    fetch('/index/adminAppVersionSetActive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    }).then(function(r) { return r.json(); }).then(function(res) {
      layui.layer.msg(res.code === 0 ? '设置成功' : (res.msg || '设置失败'));
      if (res.code === 0) loadList(currentPage);
    }).catch(function(e) {
      layui.layer.msg('演示版本不允许修改！');
    });
    layui.layer.close(index);
  });
}

function unsetActive(id) {
  layui.layer.confirm('确定取消此版本的线上发行？取消后APP将不再提示更新。', function(index) {
    fetch('/index/adminAppVersionUnsetActive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    }).then(function(r) { return r.json(); }).then(function(res) {
      layui.layer.msg(res.code === 0 ? '已取消' : (res.msg || '操作失败'));
      if (res.code === 0) loadList(currentPage);
    }).catch(function(e) {
      layui.layer.msg('演示版本功能演示，不允许改变状态！');
    });
    layui.layer.close(index);
  });
}

function deleteVersion(id) {
  layui.layer.confirm('确定删除此版本？wgt文件也会一并删除。', function(index) {
    fetch('/index/adminAppVersionDelete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    }).then(function(r) { return r.json(); }).then(function(res) {
      layui.layer.msg(res.code === 0 ? '删除成功' : (res.msg || '删除失败'));
      if (res.code === 0) loadList(currentPage);
    }).catch(function(e) {
      layui.layer.msg('不要随便删除数据，让其他人也能够看到！');
    });
    layui.layer.close(index);
  });
}

loadList(1);
</script>
</body>
</html>

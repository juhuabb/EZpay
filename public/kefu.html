<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>在线客服</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #f5f5f5; }
    .loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #999; font-size: 14px;
    }
    .loading .spinner {
      width: 36px; height: 36px; border: 3px solid #ddd;
      border-top-color: #2979FF; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>正在连接客服...</div>
  </div>
  <!-- Tawk.to -->
  <script type="text/javascript">
  var Tawk_API = Tawk_API || {};
  Tawk_API.onLoad = function() {
    document.getElementById('loading').style.display = 'none';
    Tawk_API.maximize();
  };
  var Tawk_LoadStart = new Date();
  (function(){
    var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
    s1.async = true;
    s1.src = 'https://embed.tawk.to/6a6ed26be29d1f1d47387e33/1jv0ebtqs';
    s1.charset = 'UTF-8';
    s1.setAttribute('crossorigin', '*');
    s0.parentNode.insertBefore(s1, s0);
  })();
  </script>
</body>
</html>
